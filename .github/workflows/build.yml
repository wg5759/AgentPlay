name: Source Quality Gate

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Audit production dependencies (network failures are not vulnerability findings)
        run: node scripts/audit-dependencies.mjs --prod
      - name: Audit all dependencies
        run: node scripts/audit-dependencies.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-quality-evidence
          path: |
            release/security-release-scan.json
            dist/manifest.webmanifest
          if-no-files-found: warn

  windows-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Audit production dependencies (network failures are not vulnerability findings)
        run: node scripts/audit-dependencies.mjs --prod
      - name: Audit all dependencies
        run: node scripts/audit-dependencies.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: |
            release/security-release-scan.json
            dist/manifest.webmanifest
          if-no-files-found: warn

          name: windows-quality-evidence
