name: 功能建议
description: 说明你的真实使用场景与希望达到的结果
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        先讲要解决的问题，再讲你想到的方案。开放讨论也可以先发到 Discussions 的 Ideas 分类。
  - type: dropdown
    id: area
    attributes:
      label: 使用场景
      options:
        - 播放与全屏
        - 链接下载
        - 字幕与翻译
        - 视频拉片与创作
        - 文档与 OCR
        - 模型接入
        - 插件与 Skill
        - 跨平台
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 你现在遇到什么问题
      description: 请写真实工作流、频率和当前不得不绕行的步骤。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 你希望最终做到什么
      description: 尽量用可观察的结果描述，不必先决定技术方案。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前如何解决
      description: 可填写你正在使用的替代工具或临时办法。
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与方式
      options:
        - label: 我愿意补充样例或参与复测。
        - label: 我愿意在维护者确认方案后提交 PR。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我不会在公开 Issue 中提交 API Key、Cookie 或私密文件。
          required: true
